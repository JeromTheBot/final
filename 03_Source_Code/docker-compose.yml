services:
  api:
    build: { context: ., args: { INDEX_ROWS: "100000" } }
    image: netops-assistant:latest
    env_file: [.env]
    ports: ["8000:8000"]
    volumes: ["feedback:/app/data/feedback"]
    environment:
      NETOPS_FEEDBACK_DB: /app/data/feedback/feedback.db
  ui:
    image: netops-assistant:latest
    depends_on: [api]
    command: ["streamlit", "run", "frontend/streamlit_app.py", "--server.port=8501", "--server.address=0.0.0.0"]
    environment:
      NETOPS_API_URL: http://api:8000
    ports: ["8501:8501"]
volumes:
  feedback: {}
